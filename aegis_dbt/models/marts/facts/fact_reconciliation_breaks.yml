version: 2

models:
  - name: fact_reconciliation_breaks
    description: One assessment per authorization ID observed across the three sources.
    columns:
      - name: break_key
        data_tests: [unique, not_null]
      - name: authorization_id
        data_tests: [unique, not_null]
      - name: reconciliation_status
        data_tests: [not_null]
      - name: currency_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currencies')
                field: currency_key
      - name: is_actionable_break
        data_tests: [not_null]
