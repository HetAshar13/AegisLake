bundle:
  name: aegislake

include:
  - resources/*.yml

variables:
  catalog:
    description: "Unity Catalog root catalog for financial datasets"
    default: "aegislake_catalog"
  schema:
    description: "Target database schema for payment reconciliation"
    default: "reconciliation"
  s3_lakehouse_bucket:
    description: "AWS S3 Lakehouse Bucket provisioned by Terraform"
    default: "aegislake-lakehouse-prod-eu-west-1"

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: "https://dbc-aegislake-dev.cloud.databricks.com"
    variables:
      catalog: "aegislake_dev"
      schema: "reconciliation_dev"

  prod:
    mode: production
    workspace:
      host: "https://dbc-aegislake-prod.cloud.databricks.com"
    variables:
      catalog: "aegislake_prod"
      schema: "reconciliation_prod"
