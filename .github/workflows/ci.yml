name: AegisLake Enterprise CI/CD Quality Gate

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_databricks:
        description: Validate the Databricks bundle with workspace credentials
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # 1. Code Linting & Static Analysis
  # =====================================================================
  lint:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Ruff Linter
        run: uvx ruff check .

  # =====================================================================
  # 2. Automated Test Suite (PySpark, Delta Lake, LangGraph, dbt)
  # =====================================================================
  test:
    name: Automated Financial Lakehouse Test Suite
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Required for PySpark Catalyst Engine)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Virtual Environment
        run: uv venv --python 3.12

      - name: Install Project Dependencies
        run: uv pip install -r requirements.txt

      - name: Run Full Pytest Suite (Streaming, Lakehouse, dbt, Agents, IaC, DAB)
        env:
          PYTHONPATH: src
        run: uv run pytest -v tests/ --junitxml=pytest-results.xml

      - name: Retain Python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  # =====================================================================
  # 3. dbt Kimball Model Compilation & Invariant Verification
  # =====================================================================
  dbt-validation:
    name: Build the reconciliation demo and verify Gold
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python Virtual Environment
        run: uv venv --python 3.12

      - name: Install the pinned stack
        run: uv pip install -r requirements.txt

      - name: Build Delta and dbt Gold from the fixture
        env:
          PYTHONPATH: src
        run: uv run python scripts/run_card_demo.py --output runs/ci --expected fixtures/card_demo_expected.json

      - name: Verify the Streamlit analyst view
        env:
          AEGIS_WAREHOUSE: runs/ci/aegislake.duckdb
        shell: bash
        run: |
          uv run python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file('src/aegis_ui/app.py', default_timeout=30).run()
          assert not app.exception, app.exception
          metrics = {metric.label: metric.value for metric in app.metric}
          assert metrics['Match rate among assessed cases'] == '20.0%', metrics
          assert metrics['Actionable breaks'] == '8', metrics
          app.selectbox[0].select('card_ledger_short').run()
          assert not app.exception, app.exception
          assert app.subheader[0].value == 'BREAK_LEDGER_AMOUNT_MISMATCH', app.subheader
          assert app.dataframe[1].value.iloc[2]['Amount (minor units)'] == 9990
          PY

      - name: Verify checkpoint restart and late correction
        env:
          PYTHONPATH: src
        run: uv run python scripts/verify_card_replay.py --output runs/ci-replay

      - name: Retain dbt evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results
          path: runs/ci/dbt_target/run_results.json

  # =====================================================================
  # 4. Continuous Deployment (CD): Databricks Asset Bundle Dry-Run Deploy
  # =====================================================================
  deploy-dry-run:
    name: Databricks Bundle (DAB) Dry-Run Validation
    runs-on: ubuntu-latest
    needs: [test, dbt-validation]
    if: github.event_name == 'workflow_dispatch' && inputs.validate_databricks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Databricks Asset Bundle Schema
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate --output json
